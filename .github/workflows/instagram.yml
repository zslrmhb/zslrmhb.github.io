# .github/workflows/instagram.yml
name: Fetch Instagram + Build Site

on:
  schedule:
    - cron: "0 0 * * 1" # Mondays 00:00 UTC
  push:
    branches:
      - svelte5
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Fetch Instagram media -> photos.json
        env:
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_LONG_LIVED_TOKEN: ${{ secrets.IG_LONG_LIVED_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: npx tsx scripts/fetch-instagram.ts

      - name: Build site
        run: |
          rm -rf docs
          npm run build
          cp -r build docs
          touch docs/.nojekyll

      - name: Commit & Push changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: update site + Instagram feed"
            git push origin HEAD:svelte5
          else
            echo "No changes to commit."
          fi