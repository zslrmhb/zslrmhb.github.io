# .github/workflows/instagram.yml
name: Fetch Instagram + Build Site

on:
  schedule:
    - cron: '0 0 * * 1' # Mondays 00:00 UTC
  push:
    branches:
      - svelte5
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch_and_build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: scripts/world/requirements.txt

      - name: Install pinned photo-analysis dependency
        run: python -m pip install -r scripts/world/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Test deterministic photo-feature pipeline
        run: npm run world:test

      - name: Install WebP encoder
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Fetch Instagram media -> photos.json
        env:
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_LONG_LIVED_TOKEN: ${{ secrets.IG_LONG_LIVED_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: npm run photos:fetch

      - name: Generate and validate static photo features
        run: |
          npm run world:features
          npm run world:check
          python scripts/world/build_colour_echoes.py

      - name: Build site
        run: |
          rm -rf docs
          npm run build
          cp -r build docs
          touch docs/.nojekyll

      - name: Commit & Push changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: update site + Instagram feed"
            git push origin HEAD:svelte5
          else
            echo "No changes to commit."
          fi
