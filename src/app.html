<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				const savedTheme = localStorage.getItem('theme');
				const useDark = savedTheme === 'dark';
				document.documentElement.classList.toggle('dark', useDark);
				document.documentElement.style.colorScheme = useDark ? 'dark' : 'light';
			} catch {}

			if (
				location.pathname === '/' &&
				!location.hash &&
				matchMedia('(prefers-reduced-motion: no-preference)').matches
			) {
				try {
					if (!sessionStorage.getItem('folio:entrance-seen')) {
						const root = document.documentElement;
						root.dataset.entrance = 'pending';
						setTimeout(() => {
							if (root.dataset.entrance === 'pending') delete root.dataset.entrance;
						}, 2500);
					}
				} catch {}
			}
		</script>
		<style>
			.page-entrance {
				display: none;
			}
			@media (prefers-reduced-motion: no-preference) {
				html[data-entrance] .page-entrance {
					display: block;
					position: fixed;
					inset: 0;
					z-index: 20;
					pointer-events: none;
				}
				html[data-entrance='pending'] .page-entrance {
					background: #fff;
				}
				.page-entrance canvas {
					display: block;
					position: absolute;
					inset: 0;
					z-index: 1;
					width: 100%;
					height: 100%;
				}
				.entrance-skip {
					position: absolute;
					z-index: 2;
					inset: auto 1rem 1rem auto;
					pointer-events: auto;
					color: #242421;
					background: #fff;
					text-decoration: underline;
					text-underline-offset: 0.25em;
				}
				html[data-entrance] [data-entrance-hero] {
					opacity: 0;
				}
				html[data-entrance='pending'] .entrance-skip,
				html[data-entrance='blank'] .entrance-skip {
					visibility: hidden;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="page-entrance">
			<canvas aria-hidden="true"></canvas>
			<p class="entrance-status sr-only" role="status"></p>
			<button class="entrance-skip" type="button">Skip intro</button>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
